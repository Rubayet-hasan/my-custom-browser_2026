name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Minimal Gradle Project Structure
      run: |
        # যদি গ্রেডল র‍্যাপার বা বিল্ড ফাইল মিসিং থাকে তবে তা স্ক্রিপ্ট দিয়ে হ্যান্ডেল করা
        mkdir -p app/src/main
        if [ ! -f "build.gradle" ]; then
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:7.4.2' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
        fi
        if [ ! -f "settings.gradle" ]; then
          echo "include ':app'" > settings.gradle
        fi
        if [ ! -f "app/build.gradle" ]; then
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.example.browser'; compileSdk 33; defaultConfig { applicationId 'com.example.browser'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' } }" >> app/build.gradle
        /bin/true
        fi

    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper

    - name: Build Debug APK
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
